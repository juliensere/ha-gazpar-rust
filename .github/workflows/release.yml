# Publication d'une version (PLAN.md §9, §10), à la pose d'un tag vAAAA.M.N.
#
# Procédure : dans CHANGELOG.md, renommer « Non publié » en
# « ## [AAAA.M.N] - AAAA-MM-JJ » (et rouvrir une section « Non publié » vide),
# mettre la même version dans Cargo.toml, `make release-check`, commit, puis
#   git tag vAAAA.M.N && git push origin vAAAA.M.N
#
# Actions tierces épinglées par SHA de commit (version en commentaire),
# SHA résolus avec `git ls-remote --tags` le 2026-11-16 ; images utilitaires
# (binfmt, buildkit) épinglées par condensé.

name: Publication

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/juliensere/ha-gazpar-rust

jobs:
  check:
    name: Concordance des versions et make check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tag = version de Cargo.toml, AAAA.M = HA_VERSION du Makefile, section
      # datée dans CHANGELOG.md, Rust de l'image = rust-toolchain.toml.
      - name: Tag, Cargo.toml, HA_VERSION et CHANGELOG.md
        run: scripts/release-check.sh check "$GITHUB_REF_NAME"

      - name: Chaîne de compilation de rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version

      # Pas de cache de compilation : la publication repart de zéro.
      - name: Installation de cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0

      - run: make check

  publish:
    name: Image, binaires et version GitHub
    needs: check
    runs-on: ubuntu-24.04
    # arm64 est compilé sous émulation QEMU (voir le Dockerfile).
    timeout-minutes: 60
    permissions:
      contents: write # version GitHub
      packages: write # image sur ghcr.io
      id-token: write # attestations signées (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tous les tags, pour les étiquettes AAAA.M et latest

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # AAAA.M.N toujours ; AAAA.M et latest seulement si ce tag est le plus
      # récent de sa lignée, ou de tous : un correctif d'une ancienne lignée
      # ne les fait pas reculer.
      - name: Étiquettes de l'image
        id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          lineage=${version%.*}
          newest() { git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1; }
          tags="$IMAGE:$version"
          if [[ $(newest "v$lineage.*") == "$GITHUB_REF_NAME" ]]; then tags+=" $IMAGE:$lineage"; fi
          if [[ $(newest 'v*.*.*') == "$GITHUB_REF_NAME" ]]; then tags+=" $IMAGE:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Étiquettes : $tags"

      - name: Connexion à ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Provenance et SBOM de BuildKit jointes à l'index de l'image.
      - name: Image linux/amd64 et linux/arm64
        id: build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          for t in $TAGS; do args+=(--tag "$t"); done
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --provenance=mode=max --sbom=true \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            "${args[@]}" --push .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          [[ $digest == sha256:* ]] || { echo "condensé de l'image introuvable" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "**Image** : \`$IMAGE@$digest\` ($TAGS)" >> "$GITHUB_STEP_SUMMARY"

      # Attestation signée, vérifiable avec `gh attestation verify
      # oci://ghcr.io/juliensere/ha-gazpar-rust:AAAA.M.N --repo …`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Mêmes binaires que dans l'image (étape `bin` du Dockerfile, reprise
      # du cache de la construction précédente).
      - name: Binaires statiques amd64 et arm64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          make dist
          for a in amd64 arm64; do
            bin="dist/ha-gazpar-$VERSION-linux-$a"
            file "$bin"
            file "$bin" | grep -q 'static' || { echo "$bin n'est pas statique" >&2; exit 1; }
            "$bin" --version | grep -F "ha-gazpar $VERSION " # arm64 via binfmt
            echo "**$(basename "$bin")** : $(stat -c %s "$bin") octets" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ha-gazpar-*

      # Texte de la version = section de CHANGELOG.md, binaires et SHA256SUMS
      # en pièces jointes.
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          scripts/release-check.sh notes "$GITHUB_REF_NAME" > "$notes"
          cat >> "$notes" <<EOF

          ---

          Image \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64), condensé \`$DIGEST\`.
          Binaires statiques ci-dessous, sommes dans \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS --ignore-missing\`) ; provenance : \`gh attestation verify <fichier> --repo $GH_REPO\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" \
            --notes-file "$notes" dist/ha-gazpar-* dist/SHA256SUMS
