# Intégration continue (PLAN.md §9).
#
# Actions tierces épinglées par SHA de commit (version en commentaire),
# SHA résolus avec `git ls-remote --tags` le 2026-11-16.
#
# Publication (tag vAAAA.M.N, image multi-architecture) : release.yml.
#
# L'image arm64, compilée sous émulation QEMU, n'est construite qu'à la
# publication ; ici, l'image amd64 seule.

name: CI

on:
  push:
  pull_request:
  schedule:
    # Chaque lundi : nouvelles failles des dépendances même sans commit.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chaîne de compilation de rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Installation de cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0

      # Format, clippy, tests, cargo deny, plafond de crates, DEPENDENCIES.md
      # à jour, concordance HA_VERSION / Cargo.toml.
      - run: make check

  cover:
    name: Couverture des tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chaîne de compilation de rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Installation de cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      # Échoue sous COVER_MIN % de lignes couvertes (Makefile, PLAN.md §8).
      - run: make cover

  # PLAN.md §10.2 : une pull request qui modifie src/ met à jour CHANGELOG.md,
  # sauf si son titre contient [sans changelog].
  changelog:
    name: Notes de version à jour
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: src/ modifié sans CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if printf '%s\n' "$changed" | grep -q '^src/' \
             && ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md' \
             && [[ "$TITLE" != *"[sans changelog]"* ]]; then
            echo "::error::src/ est modifié mais pas CHANGELOG.md (ajoutez [sans changelog] au titre si aucun changement n'est visible)"
            exit 1
          fi

  build:
    name: Compilation release x86_64 (statique)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET: x86_64-unknown-linux-musl
      # ring compile du C : avec musl-gcc pour une cible musl.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chaîne de compilation et cible musl
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}

      - run: cargo build --release --locked --target "$TARGET"

      - name: Taille du binaire
        run: |
          bin="target/$TARGET/release/ha-gazpar"
          file "$bin"
          "$bin" --version
          size=$(stat -c %s "$bin")
          echo "ha-gazpar ($TARGET) : $size octets"
          echo "**ha-gazpar ($TARGET)** : $size octets" >> "$GITHUB_STEP_SUMMARY"
          # Plafond (PLAN.md §9) : 2 417 616 octets mesurés le 2026-11-16,
          # plus une marge. Le relever exige une justification.
          max=3145728
          if [ "$size" -gt "$max" ]; then
            echo "::error::binaire de $size octets, plafond $max"
            exit 1
          fi

  # Détecte tôt une casse du Dockerfile ; rien n'est poussé.
  image:
    name: Image Docker amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: make image PLATFORMS=linux/amd64

      # Sans réseau : `check` sans configuration ne contacte rien.
      - name: Lancement de l'image
        run: |
          img=ha-gazpar-rust:dev
          docker run --rm --network none "$img" --version
          docker run --rm --network none --read-only --cap-drop ALL --user 1000:1000 "$img" --version
          rc=0; docker run --rm --network none "$img" check || rc=$?
          [ "$rc" -eq 2 ] || { echo "check sans configuration : code $rc, attendu 2" >&2; exit 1; }
          env=$(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$img" | grep -E '^(GAZPAR|GRDF|HA)_' || true)
          [ -z "$env" ] || { echo "variables de configuration dans l'image : $env" >&2; exit 1; }

  advisories:
    name: Avis de sécurité (planifié)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          arguments: --locked
          command: check advisories

  # Essai réel contre la version de référence (HA_VERSION du Makefile).
  ha:
    name: Home Assistant de référence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chaîne de compilation de rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ha

      # Démarre HA (utilisateur et jeton créés par onboarding), puis les essais.
      - run: make test-ha

      - name: Version de Home Assistant
        if: always()
        run: |
          v=$(cut -d' ' -f1 target/ha-test/version 2>/dev/null || echo "inconnue")
          echo "**Home Assistant (référence)** : $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Arrêt de Home Assistant
        if: always()
        run: make ha-down

      - name: Journal de Home Assistant
        if: failure()
        run: tail -n 200 target/ha-test.log || true

  # Même essai contre home-assistant:stable, en exécution planifiée : un
  # échec ouvre un ticket, l'alerte « une nouvelle version de HA casse
  # l'import » (PLAN.md §9, §10.1).
  ha-stable:
    name: Home Assistant stable (planifié)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      HA_TAG: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Chaîne de compilation de rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ha

      # Démarre HA (utilisateur et jeton créés par onboarding), puis les essais.
      - run: make test-ha HA_TAG="$HA_TAG"

      - name: Version de Home Assistant
        if: always()
        run: |
          v=$(cut -d' ' -f1 target/ha-test/version 2>/dev/null || echo "inconnue")
          # Gardée pour le ticket : make ha-down efface target/ha-test.
          echo "HA_RUN_VERSION=$v" >> "$GITHUB_ENV"
          echo "**Home Assistant $HA_TAG** : $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Arrêt de Home Assistant
        if: always()
        run: make ha-down

      - name: Journal de Home Assistant
        if: failure()
        run: tail -n 200 target/ha-test.log || true

      - name: Ticket si HA stable casse l'import
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Home Assistant stable casse l'essai d'import"
          # Comparaison exacte des titres : la recherche de gh est approximative.
          if gh issue list --state open --limit 500 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "ticket déjà ouvert : $title"
            exit 0
          fi
          gh issue create --title "$title" --body-file - <<BODY
          L'essai planifié \`make test-ha HA_TAG=stable\` a échoué contre Home Assistant ${HA_RUN_VERSION:-inconnue} : $RUN_URL

          Une nouvelle version de HA a pu changer le schéma de \`recorder/import_statistics\` ou la lecture des statistiques (PLAN.md §10.1, §12).
          BODY
